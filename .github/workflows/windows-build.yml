name: Build GPTray 0.3 for Windows (test)

on:
  # PRs provide one validation run; main remains read-only until reviewed merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout source (without persisted credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Update stable Rust (MSVC toolchain)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Test lifecycle and geometry without a GUI
        shell: pwsh
        run: |
          rustc --edition=2021 --test src-tauri/src/policy_tests.rs -o policy-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./policy-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-MeasureMemory.ps1
          ./scripts/Test-NativeHarness.ps1

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy (including tests and native probe)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Audit locked frontend tooling
        run: npm audit --audit-level=high

      - name: Run Rust test suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build native WebView2 probe
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --example native_smoke

      - name: Exercise native memory targets and viewport
        run: ./scripts/Test-NativeWebView.ps1

      - name: Upload native probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gptray-0.3-native-probe
          path: |
            native-smoke-result.json
            native-smoke.stdout.txt
            native-smoke.stderr.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build unsigned Windows x64 installer (locked Rust dependencies)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer was generated." }
          $sha = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($installer.Name)" | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload test installer and checksum
        uses: actions/upload-artifact@v5
        with:
          name: gptray-0.3-windows-x64-unsigned-test
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
