name: Build GPTray for Windows (test)

on:
  # This branch-only trigger lets us test the build before merging anything.
  push:
    branches:
      - ci/windows-build-test
    paths:
      - .github/workflows/windows-build.yml
      - package.json
      - package-lock.json
      - src/**
      - src-tauri/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout source (without persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Update stable Rust (MSVC toolchain)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build unsigned Windows installer
        run: npm run tauri build

      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer was generated." }
          $sha = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($installer.Name)" | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload test installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: gptray-windows-unsigned-test
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
